<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Jogo da Cobrinha - Estilo Minecraft</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: 'Courier New', Courier, monospace;
        }
        #game-header {
            text-align: center;
            margin-bottom: 10px;
        }
        #game-header h1 {
            margin: 0;
            font-size: 24px;
            color: #000;
            text-shadow: -2px 0 #FF69B4, 0 2px #FF69B4, 2px 0 #FF69B4, 0 -2px #FF69B4;
        }
        #game-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 20px;
            color: #000;
            text-shadow: -2px 0 #FF69B4, 0 2px #FF69B4, 2px 0 #FF69B4, 0 -2px #FF69B4;
        }
        #game-container {
            display: flex;
            align-items: flex-start;
            gap: 20px;
        }
        canvas {
            border: 2px solid #333;
        }
        #legend {
            width: 150px;
            background-color: rgba(200, 200, 200, 0.8);
            padding: 10px;
            font-size: 14px;
            color: #000;
            text-shadow: -1px 0 #FF69B4, 0 1px #FF69B4, 1px 0 #FF69B4, 0 -1px #FF69B4;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .legend-item canvas {
            margin-right: 5px;
            border: none;
        }
    </style>
</head>
<body>
    <div id="game-header">
        <h1>Jogo da Cobrinha</h1>
        <div id="game-info">
            <span id="score">Pontos: 0</span>
            <span id="level">Fase: 1</span>
        </div>
    </div>
    <div id="game-container">
        <div id="main-game"></div>
        <div id="legend">
            <div class="legend-item" id="golden-apple">
                <canvas id="golden-apple-icon" width="15" height="15"></canvas>
                <span>Maçã Dourada: +1 ponto</span>
            </div>
            <div class="legend-item" id="creeper" style="display: none;">
                <canvas id="creeper-icon" width="15" height="15"></canvas>
                <span>Creeper: Perde</span>
            </div>
            <div class="legend-item" id="ore" style="display: none;">
                <canvas id="ore-icon" width="15" height="15"></canvas>
                <span>Minério: +2 pontos</span>
            </div>
            <div class="legend-item" id="quartz" style="display: none;">
                <canvas id="quartz-icon" width="15" height="15"></canvas>
                <span>Quartzo: +2 pontos</span>
            </div>
        </div>
    </div>
<script>
let snake, fruit, scale = 20, cols = 20, rows = 20;
let gameState = { score: 0, level: 1, game_over: false, speed: 5 };
let decorations = [], creepers = [];

// Pequenos sketches para desenhar os ícones da legenda
let goldenAppleSketch = function(p) {
    p.setup = function() {
        p.noLoop();
        p.fill(255, 0, 0); // Vermelho para a Maçã Dourada
        p.rect(0, 0, 15, 15);
        p.stroke(0);
        p.strokeWeight(1);
        p.fill(255, 69, 0); // Vermelho mais claro para detalhe
        p.rect(2, 2, 11, 11);
        p.noStroke();
        p.fill(0, 128, 0);
        p.rect(5, 0, 4, 5);
    };
};
new p5(goldenAppleSketch, 'golden-apple-icon');

let creeperSketch = function(p) {
    p.setup = function() {
        p.noLoop();
        p.fill(0, 0, 0); // Preto para o Creeper
        p.rect(0, 0, 15, 15);
        p.stroke(255); // Contorno branco para destaque
        p.strokeWeight(1);
        p.fill(50, 50, 50); // Cinza escuro para detalhe
        p.rect(2, 2, 11, 11);
        p.fill(255); // Branco para o rosto
        p.rect(3, 3, 3, 3);
        p.rect(9, 3, 3, 3);
        p.rect(6, 6, 3, 6);
        p.noStroke();
    };
};
new p5(creeperSketch, 'creeper-icon');

let oreSketch = function(p) {
    p.setup = function() {
        p.noLoop();
        p.fill(128, 128, 128);
        p.rect(0, 0, 15, 15);
        p.stroke(0);
        p.strokeWeight(1);
        p.fill(0, 191, 255);
        p.rect(2, 2, 11, 11);
        p.noStroke();
    };
};
new p5(oreSketch, 'ore-icon');

let quartzSketch = function(p) {
    p.setup = function() {
        p.noLoop();
        p.fill(255, 245, 238);
        p.rect(0, 0, 15, 15);
        p.stroke(0);
        p.strokeWeight(1);
        p.fill(255, 255, 255);
        p.rect(2, 2, 11, 11);
        p.noStroke();
    };
};
new p5(quartzSketch, 'quartz-icon');

function setup() {
    let canvas = createCanvas(cols * scale, rows * scale);
    canvas.parent('main-game');
    frameRate(gameState.speed);
    snake = new Snake();
    fruit = new Fruit();
    updateGameState();

    // Inicializa elementos decorativos e inimigos
    updateDecorations();
    updateCreepers();
    textFont('Courier New');
}

function draw() {
    // Desenha o fundo do bioma baseado na fase
    drawMinecraftBackground();

    // Desenha o sol (ou lua no Nether) com raios e carinha
    drawSun();

    // Desenha elementos decorativos (flores, árvores, cactos, etc.)
    for (let decoration of decorations) {
        decoration.show();
    }

    // Desenha e atualiza creepers
    for (let creeper of creepers) {
        creeper.update();
        creeper.show();
    }

    if (gameState.game_over) {
        textSize(32);
        textAlign(CENTER, CENTER);
        stroke(255, 105, 180);
        strokeWeight(4);
        fill(0);
        if (gameState.level > 5) {
            text('Parabéns! Você venceu!', width / 2, height / 2);
        } else {
            text('Fim de Jogo! Tente novamente!', width / 2, height / 2);
        }
        noStroke();
        return;
    }

    snake.update();
    snake.show();
    fruit.show();

    if (snake.eat(fruit)) {
        gameState.score++;
        updateGameState();
        fruit = new Fruit();
        updateDecorations();
        updateCreepers();
    }

    // Verifica colisão com creepers
    for (let creeper of creepers) {
        if (snake.x === creeper.x && snake.y === creeper.y) {
            gameState.game_over = true;
            resetGame();
        }
    }

    // Verifica colisão com blocos interativos (minérios e quartzo)
    for (let i = decorations.length - 1; i >= 0; i--) {
        let decoration = decorations[i];
        if ((decoration.type === 'ore' || decoration.type === 'quartz') && snake.x === decoration.gridX && snake.y === decoration.gridY) {
            gameState.score += 2;
            updateGameState();
            decorations.splice(i, 1);
            decorations.push(new Decoration(decoration.type));
        }
    }
}

function drawMinecraftBackground() {
    let skyHeight = height * 0.7;
    let groundHeight = height * 0.3;

    if (gameState.level === 1) {
        background(135, 206, 250);
        fill(124, 252, 0);
        rect(0, skyHeight, width, groundHeight);
    } else if (gameState.level === 2) {
        background(100, 149, 237);
        fill(124, 252, 0);
        rect(0, skyHeight, width, groundHeight);
    } else if (gameState.level === 3) {
        background(255, 218, 185);
        fill(194, 178, 128);
        rect(0, skyHeight, width, groundHeight);
    } else if (gameState.level === 4) {
        background(169, 169, 169);
        fill(128, 128, 128);
        rect(0, skyHeight, width, groundHeight);
        fill(255);
        for (let i = 0; i < 5; i++) {
            let x = random(width);
            rect(x, skyHeight, 30, 30);
        }
    } else if (gameState.level === 5) {
        background(139, 0, 0);
        fill(178, 34, 34);
        rect(0, skyHeight, width, groundHeight);
        fill(255, 69, 0);
        for (let i = 0; i < 3; i++) {
            let x = random(width);
            rect(x, skyHeight + groundHeight - 10, 40, 10);
        }
    }
}

function drawSun() {
    if (gameState.level === 5) {
        fill(139, 0, 0);
        rect(30, 30, 37, 37);
        stroke(0);
        strokeWeight(1);
        fill(178, 34, 34);
        rect(32, 32, 33, 33);
        fill(0);
        rect(38, 38, 8, 8);
        rect(54, 38, 8, 8);
        rect(46, 50, 8, 4);
        noStroke();
        stroke(139, 0, 0);
        strokeWeight(2);
        for (let angle = 0; angle < 360; angle += 45) {
            let rad = radians(angle);
            let x1 = 50 + cos(rad) * 40;
            let y1 = 50 + sin(rad) * 40;
            let x2 = 50 + cos(rad) * 50;
            let y2 = 50 + sin(rad) * 50;
            line(x1, y1, x2, y2);
        }
        noStroke();
    } else {
        fill(255, 215, 0);
        rect(30, 30, 37, 37);
        stroke(0);
        strokeWeight(1);
        fill(255, 255, 0);
        rect(32, 32, 33, 33);
        fill(0);
        rect(38, 38, 8, 8);
        rect(54, 38, 8, 8);
        rect(46, 50, 8, 4);
        noStroke();
        stroke(255, 215, 0);
        strokeWeight(2);
        for (let angle = 0; angle < 360; angle += 45) {
            let rad = radians(angle);
            let x1 = 50 + cos(rad) * 40;
            let y1 = 50 + sin(rad) * 40;
            let x2 = 50 + cos(rad) * 50;
            let y2 = 50 + sin(rad) * 50;
            line(x1, y1, x2, y2);
        }
        noStroke();
    }
}

function updateDecorations() {
    decorations = [];

    if (gameState.level === 1) {
        for (let i = 0; i < 5; i++) {
            decorations.push(new Decoration('flower', 'yellow'));
        }
    } else if (gameState.level === 2) {
        for (let i = 0; i < 3; i++) {
            decorations.push(new Decoration('tree'));
        }
        for (let i = 0; i < 3; i++) {
            decorations.push(new Decoration('flower', 'red'));
        }
    } else if (gameState.level === 3) {
        for (let i = 0; i < 4; i++) {
            decorations.push(new Decoration('cactus'));
        }
    } else if (gameState.level === 4) {
        for (let i = 0; i < 3; i++) {
            decorations.push(new Decoration('ore'));
        }
    } else if (gameState.level === 5) {
        for (let i = 0; i < 3; i++) {
            decorations.push(new Decoration('quartz'));
        }
    }

    // Atualiza a visibilidade dos itens da legenda
    document.getElementById('creeper').style.display = gameState.level >= 2 ? 'flex' : 'none';
    document.getElementById('ore').style.display = gameState.level >= 4 ? 'flex' : 'none';
    document.getElementById('quartz').style.display = gameState.level >= 5 ? 'flex' : 'none';
}

function updateCreepers() {
    creepers = [];
    let creeperCount = gameState.level - 1;
    for (let i = 0; i < creeperCount; i++) {
        creepers.push(new Creeper());
    }
}

function keyPressed() {
    if (keyCode === UP_ARROW && snake.ydir !== 1) {
        snake.dir(0, -1);
    } else if (keyCode === DOWN_ARROW && snake.ydir !== -1) {
        snake.dir(0, 1);
    } else if (keyCode === LEFT_ARROW && snake.xdir !== 1) {
        snake.dir(-1, 0);
    } else if (keyCode === RIGHT_ARROW && snake.xdir !== -1) {
        snake.dir(1, 0);
    }
}

function Snake() {
    this.x = floor(cols / 2);
    this.y = floor(rows / 2);
    this.xdir = 0;
    this.ydir = 0;
    this.tail = [];

    this.dir = function(x, y) {
        this.xdir = x;
        this.ydir = y;
    }

    this.update = function() {
        this.tail.unshift({x: this.x, y: this.y});
        if (this.tail.length > gameState.score) {
            this.tail.pop();
        }

        this.x += this.xdir;
        this.y += this.ydir;

        if (this.x < 0 || this.x >= cols || this.y < 0 || this.y >= rows) {
            gameState.game_over = true;
            resetGame();
        }

        for (let segment of this.tail) {
            if (this.x === segment.x && this.y === segment.y) {
                gameState.game_over = true;
                resetGame();
            }
        }
    }

    this.show = function() {
        for (let i = 0; i < this.tail.length; i++) {
            let segment = this.tail[i];
            fill(0, 155, 0);
            rect(segment.x * scale, segment.y * scale, scale, scale);
            stroke(0);
            strokeWeight(1);
            fill(0, 205, 0);
            rect(segment.x * scale + 2, segment.y * scale + 2, scale - 4, scale - 4);
            noStroke();
        }

        fill(0, 155, 0);
        rect(this.x * scale, this.y * scale, scale, scale);
        stroke(0);
        strokeWeight(1);
        fill(0, 205, 0);
        rect(this.x * scale + 2, this.y * scale + 2, scale - 4, scale - 4);
        noStroke();
        fill(255);
        let eyeSize = scale / 4;
        let eyeOffsetX = this.xdir === 0 ? scale / 4 : (this.xdir === 1 ? scale / 2 : -scale / 2);
        let eyeOffsetY = this.ydir === 0 ? scale / 4 : (this.ydir === 1 ? scale / 2 : -scale / 2);
        rect((this.x * scale) + scale / 2 + eyeOffsetX - eyeSize / 2, (this.y * scale) + scale / 2 + eyeOffsetY - eyeSize / 2, eyeSize, eyeSize);
        rect((this.x * scale) + scale / 2 - eyeOffsetX - eyeSize / 2, (this.y * scale) + scale / 2 - eyeOffsetY - eyeSize / 2, eyeSize, eyeSize);
        fill(0);
        rect((this.x * scale) + scale / 2 + eyeOffsetX - eyeSize / 4, (this.y * scale) + scale / 2 + eyeOffsetY - eyeSize / 4, eyeSize / 2, eyeSize / 2);
        rect((this.x * scale) + scale / 2 - eyeOffsetX - eyeSize / 4, (this.y * scale) + scale / 2 - eyeOffsetY - eyeSize / 4, eyeSize / 2, eyeSize / 2);
    }

    this.eat = function(fruit) {
        return this.x === fruit.x && this.y === fruit.y;
    }
}

function Fruit() {
    this.x = floor(random(cols));
    this.y = floor(random(rows));
    this.show = function() {
        fill(255, 0, 0); // Vermelho para a Maçã Dourada
        rect(this.x * scale, this.y * scale, scale, scale);
        stroke(0);
        strokeWeight(1);
        fill(255, 69, 0); // Vermelho mais claro para detalhe
        rect(this.x * scale + 2, this.y * scale + 2, scale - 4, scale - 4);
        noStroke();
        fill(0, 128, 0);
        rect((this.x + 0.5) * scale - 2, this.y * scale, 4, scale / 3);
    }
}

function Creeper() {
    this.x = floor(random(cols));
    this.y = floor(random(rows));
    this.speedX = random([-1, 0, 1]);
    this.speedY = random([-1, 0, 1]);
    this.moveTimer = 0;

    this.update = function() {
        this.moveTimer++;
        if (this.moveTimer >= 60) {
            this.x += this.speedX;
            this.y += this.speedY;
            this.x = constrain(this.x, 0, cols - 1);
            this.y = constrain(this.y, 0, rows - 1);
            this.speedX = random([-1, 0, 1]);
            this.speedY = random([-1, 0, 1]);
            this.moveTimer = 0;
        }
    }

    this.show = function() {
        fill(50, 205, 50);
        rect(this.x * scale, this.y * scale, scale, scale);
        stroke(0);
        strokeWeight(1);
        fill(0, 255, 0);
        rect(this.x * scale + 2, this.y * scale + 2, scale - 4, scale - 4);
        fill(0);
        rect(this.x * scale + 4, this.y * scale + 4, 4, 4);
        rect(this.x * scale + 12, this.y * scale + 4, 4, 4);
        rect(this.x * scale + 8, this.y * scale + 8, 4, 8);
        noStroke();
    }
}

function Decoration(type, color = null) {
    this.gridX = floor(random(cols));
    this.gridY = floor(random(rows));
    this.x = this.gridX * scale;
    this.y = this.gridY * scale;
    this.type = type;
    this.color = color;

    this.show = function() {
        if (this.type === 'flower') {
            fill(this.color === 'yellow' ? 'yellow' : 'red');
            rect(this.x - 5, this.y - 5, 10, 10);
            stroke(0);
            strokeWeight(1);
            fill(255, 255, 0);
            rect(this.x - 3, this.y - 3, 6, 6);
            noStroke();
            fill(0, 128, 0);
            rect(this.x - 2, this.y, 4, height - this.y);
        } else if (this.type === 'tree') {
            fill(139, 69, 19);
            rect(this.x - 5, this.y - 20, 10, 20);
            stroke(0);
            strokeWeight(1);
            fill(165, 42, 42);
            rect(this.x - 3, this.y - 18, 6, 18);
            noStroke();
            fill(0, 155, 0);
            rect(this.x - 15, this.y - 40, 30, 20);
            stroke(0);
            strokeWeight(1);
            fill(0, 205, 0);
            rect(this.x - 13, this.y - 38, 26, 16);
            noStroke();
        } else if (this.type === 'cactus') {
            fill(0, 155, 0);
            rect(this.x - 5, this.y - 30, 10, 30);
            stroke(0);
            strokeWeight(1);
            fill(0, 205, 0);
            rect(this.x - 3, this.y - 28, 6, 26);
            noStroke();
        } else if (this.type === 'ore') {
            fill(128, 128, 128);
            rect(this.x - 5, this.y - 5, 10, 10);
            stroke(0);
            strokeWeight(1);
            fill(0, 191, 255);
            rect(this.x - 3, this.y - 3, 6, 6);
            noStroke();
        } else if (this.type === 'quartz') {
            fill(255, 245, 238);
            rect(this.x - 5, this.y - 5, 10, 10);
            stroke(0);
            strokeWeight(1);
            fill(255, 255, 255);
            rect(this.x - 3, this.y - 3, 6, 6);
            noStroke();
        }
    }
}

function updateGameState() {
    fetch('/update_state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ score: gameState.score })
    })
    .then(response => response.json())
    .then(data => {
        gameState = data;
        frameRate(gameState.speed);
        document.getElementById('score').innerText = `Pontos: ${gameState.score}`;
        document.getElementById('level').innerText = `Fase: ${gameState.level}`;
    })
    .catch(error => {
        console.error('Erro ao atualizar o estado do jogo:', error);
    });
}

function resetGame() {
    fetch('/reset', { method: 'POST' })
    .then(response => response.json())
    .then(data => {
        gameState = data;
        snake = new Snake();
        fruit = new Fruit();
        frameRate(gameState.speed);
        updateDecorations();
        updateCreepers();
        document.getElementById('score').innerText = `Pontos: ${gameState.score}`;
        document.getElementById('level').innerText = `Fase: ${gameState.level}`;
    })
    .catch(error => {
        console.error('Erro ao resetar o jogo:', error);
    });
}
</script>
</body>
</html>
